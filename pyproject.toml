[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sportstrends"
version = "0.1.0"
description = "Shareable sports data visualizations: multi-decade league trends down to play-by-play stories"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2,<4",
    "pyarrow>=16,<27",
    "duckdb>=1.1,<3",
    "requests>=2.31,<3",
    "typer>=0.12,<1",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
# `st captions` (Claude API) and `st render` (Playwright) are optional at install time
captions = ["anthropic>=1,<2"]
render = ["playwright>=1.45,<2"]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "anthropic>=1,<2",
    "playwright>=1.45,<2",
]

[project.scripts]
st = "sportstrends.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
